<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Name Cubes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#1e3a8a,#0f172a 70%);
}

.name{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
    justify-content:center;
}

.cube{
    position:relative;
    width:110px;
    height:110px;
    transform-style:preserve-3d;
    transform:rotateX(-20deg) rotateY(25deg);
}

/* Front Face */
.front{
    position:absolute;
    inset:0;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    font-weight:900;
    color:white;
    transform:translateZ(25px);
    box-shadow:
    0 25px 40px rgba(0,0,0,.35),
    inset 0 2px 10px rgba(255,255,255,.25);
}

/* Right Face */
.right{
    position:absolute;
    top:0;
    right:-25px;
    width:25px;
    height:110px;
    border-radius:0 22px 22px 0;
    transform-origin:left;
    transform:rotateY(90deg);
    filter:brightness(.7);
}

/* Top Face */
.top{
    position:absolute;
    top:-25px;
    left:0;
    width:110px;
    height:25px;
    border-radius:22px 22px 0 0;
    transform-origin:bottom;
    transform:rotateX(90deg);
    filter:brightness(1.2);
}

/* Shine */
.front::before{
    content:'';
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    height:25px;
    border-radius:20px;
    background:rgba(255,255,255,.18);
}

/* Colors */

.c1 .front,.c1 .right,.c1 .top{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.c2 .front,.c2 .right,.c2 .top{
    background:linear-gradient(135deg,#00c6ff,#0072ff);
}

.c3 .front,.c3 .right,.c3 .top{
    background:linear-gradient(135deg,#00b09b,#96c93d);
}

.c4 .front,.c4 .right,.c4 .top{
    background:linear-gradient(135deg,#f7971e,#ffd200);
}

.c5 .front,.c5 .right,.c5 .top{
    background:linear-gradient(135deg,#8e2de2,#4a00e0);
}

.c6 .front,.c6 .right,.c6 .top{
    background:linear-gradient(135deg,#fc466b,#3f5efb);
}

</style>
</head>
<body>

<div class="name">

    <div class="cube c1">
        <div class="top"></div>
        <div class="right"></div>
        <div class="front">S</div>
    </div>

    <div class="cube c2">
        <div class="top"></div>
        <div class="right"></div>
        <div class="front">T</div>
    </div>

    <div class="cube c3">
        <div class="top"></div>
        <div class="right"></div>
        <div class="front">A</div>
    </div>

    <div class="cube c4">
        <div class="top"></div>
        <div class="right"></div>
        <div class="front">W</div>
    </div>

    <div class="cube c5">
        <div class="top"></div>
        <div class="right"></div>
        <div class="front">R</div>
    </div>

    <div class="cube c6">
        <div class="top"></div>
        <div class="right"></div>
        <div class="front">O</div>
    </div>

</div>

</body>
</html>
